services:
  - type: web
    name: aurora-music-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build && python3 -m venv .render-python && .render-python/bin/pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: YT_DLP_PATH
        value: .render-python/bin/yt-dlp
      - key: YT_DLP_JS_RUNTIME
        value: node
